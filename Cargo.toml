[package]
name = "power-usage"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "power-usage"
path = "src/main.rs"

[dependencies]
axum = "0.8"
clap = { version = "4", features = ["derive"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.16", default-features = false }
socket2 = "0.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
